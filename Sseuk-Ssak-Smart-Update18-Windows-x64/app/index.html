<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쓱-싹 · 파일 정리</title><link rel="icon" href="icon.ico"><link rel="stylesheet" href="style.css">
<body><div class="shell"><aside><div class="brand"><img src="mark.png" alt="">쓱-싹</div><div class="nav-caption">내 작업 공간</div><nav><button id="emptyRecycle" class="navbtn">휴지통 비우기</button></nav><div class="settings"><label><input id="reduce" type="checkbox"> 모션 줄이기</label><button id="repairDownloads" class="repair-link">다운로드 표시 복구</button><small>쓱-싹 &nbsp;·&nbsp; v0.7.18</small></div></aside>
<main><header><span>내 작업 공간</span><i>/</i><b id="crumb"></b></header><div class="heading"><div><div class="eyebrow"><span></span> 파일 관리</div><h1 id="title"></h1><p id="sub"></p></div></div>
<section hidden id="scanPanel" aria-labelledby="scanTitle"><h2 id="scanTitle">폴더 검사 중</h2><p id="scanDetail" role="status"></p><div class="scan-track" aria-hidden="true"><i></i></div></section><section id="hero"></section><section id="spaceOverview" class="space-panel" hidden></section><section class="content"><div class="sectiontop"><h2 id="section"></h2><div id="tools"></div></div><div id="filters"></div><div id="list"></div></section><div id="actionbar"></div><p role="status" aria-live="polite" id="status"></p></main></div>
<dialog><h2 id="dialogTitle"></h2><p id="dialogDesc"></p><div id="dialogBtns"></div></dialog><dialog id="progressDialog" aria-labelledby="progressTitle" aria-describedby="progressHint">
<div class="progress-mark" aria-hidden="true">쓱-싹</div>
<h2 id="progressTitle">파일을 정리하고 있어요.</h2>
<div class="progress-numbers"><strong id="progressPercent">0%</strong><span id="progressCount">0 / 0개</span></div>
<progress id="progressMeter" value="0" max="100" aria-label="파일 정리 진행률"></progress>
<p id="progressFile"></p><p id="progressHint">처리가 끝나면 결과를 알려드릴게요.</p>
</dialog><dialog id="resultWindow" aria-labelledby="resultHeading"><h2 id="resultHeading">정리 결과</h2><p>이번 분류의 남은 항목과 이동 전 파일 정보를 확인하세요.</p>
<section id="resultGraphPage"><div id="resultVolumeNav"></div><div id="storageResult" class="space-panel"></div></section><section id="resultDetailPage" hidden><div id="storageTypes"></div><div id="resultTabs"></div><div class="result-scroll"><table><thead><tr><th>이름 / 경로</th><th>수정한 날짜</th><th>유형</th><th aria-sort="descending"><button id="sizeOrder" type="button">크기 ▼</button></th></tr></thead><tbody id="resultBody"></tbody></table></div>
<div id="resultPager"></div></section><div id="resultPageNav"><button id="resultPrevious" type="button">이전 페이지</button><span id="resultPageNumber" aria-live="polite">1 / 2</span><button id="resultNext" type="button" class="primary">다음 페이지</button></div><form method="dialog"><button>닫기</button></form></dialog><script src="layout_scale.js"></script><script src="storage.js"></script><script src="smart_ui.js"></script><script src="folder_ui.js"></script><script src="ui.js"></script></body></html>
