<title>쓱-싹 크롬 다운로드 연결 도우미</title>
<style>body{font-family:"Malgun Gothic",sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#191F28}h1{font-size:22px}</style>
</head>
<body>
<h1>쓱-싹 크롬 다운로드 연결 도우미</h1>
<p>쓱-싹 앱이 이 크롬 프로필의 다운로드 목록을 읽고, 휴지통 이동에 성공한 파일의 다운로드 기록만 지울 수 있게 연결합니다. 이 화면에서 직접 할 일은 없습니다.</p>
<ol>
<li>쓱-싹 앱에서 <b>크롬 다운로드 → 다운로드 파일 확인</b>을 누르세요.</li>
<li>열린 탭에서 남길 파일과 정리할 파일을 확인한 뒤 선택한 파일만 휴지통으로 옮기세요.</li>
</ol>
<p>등록 후 이 도우미 폴더를 옮기거나 삭제하면 연결이 끊깁니다. 위치를 바꿨다면 새 위치의 폴더를 다시 등록하세요.</p>
</body>
</html>
